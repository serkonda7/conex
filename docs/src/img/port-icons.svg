  <!-- Shared connector drawings. The app references a symbol with <use>, so it inherits the text color.
       Markdown editor previews cannot <use> an external file, so the docs embed
       <img src="port-icons.svg#NAME-icon">, which shows only the targeted entry at the end of this file
       on a white chip, so that it stays readable in dark themes. Every symbol needs such an entry. -->
  <style>use { display: none; } use:target { display: inline; }</style>
