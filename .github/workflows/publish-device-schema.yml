name: Publish device schema

on:
  push:
    branches: [main]
    paths:
      - packages/device-schema/package.json
  workflow_dispatch:

permissions:
  id-token: write # For OIDC
  contents: read

concurrency:
  group: publish-device-schema

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/device-schema
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      # package.json also changes without a version bump, so ask the registry.
      - name: Check for a new version
        id: version
        run: |
          name=$(jq -r .name package.json)
          version=$(jq -r .version package.json)
          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "$name@$version is already published"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.new == 'true'
        run: bun run check
      - if: steps.version.outputs.new == 'true'
        run: bun test
      # bun packs because it resolves the `catalog:` dependency, npm publishes for OIDC.
      - if: steps.version.outputs.new == 'true'
        run: bun pm pack --filename device-schema.tgz
      - if: steps.version.outputs.new == 'true'
        run: NODE_AUTH_TOKEN="" npm publish ./device-schema.tgz
