# Example server config. Copy to `data/config.toml`:
#   cp server/config.example.toml server/data/config.toml

# Public address of conex (no trailing slash). The Microsoft 365 consent
# link redirects to <frontendUrl>/api/integrations/m365/consent.
# frontendUrl = "https://conex.example.com"

[auth]
secureCookies = false   # plain-HTTP local dev; keep true behind HTTPS
# >= 32 chars. Generate with: openssl rand -hex 48
appKey = "REPLACE-ME-with-at-least-32-chars-long-random-secret"

[storage]
# Directory for image attachments. Absolute or relative to data dir.
# Must be included in backups.
attachmentsDir = "attachments"

[integrations]
# Safety switch for every outbound integration request (TANSS, Microsoft Graph).
# "mock" serves captured snapshots instead of contacting the external systems.
# Override with CONEX_INTEGRATIONS_MODE.
mode = "live"   # live | offline | mock
# Snapshot files of the mock mode. Absolute or relative to the data dir.
# Snapshots contain customer data and are never written by the server itself.
mockDir = "integrations-mock"

# AI assistant (`ai.use` permission). Leave the section out to disable it.
# Prompts are not sent while `[integrations] mode` is "offline"; in "mock"
# mode the assistant answers with canned replies.
# [ai]
# provider = "claude"   # claude | opencode
#
# [ai.claude]
# model = "claude-opus-5-5"
# effort = "medium"     # low | medium | high | xhigh | max; unset = model default
# maxTokens = 64000
# # Prefer ANTHROPIC_API_KEY in the environment over a key in this file.
# # apiKey = "sk-ant-..."
#
# [ai.opencode]
# # Base URL of `opencode serve`; its password comes from OPENCODE_SERVER_PASSWORD.
# url = "http://127.0.0.1:4096"
# # "<providerID>/<modelID>"; unset = opencode's default model.
# # model = "anthropic/claude-opus-5-5"
# timeoutSeconds = 300
#
# [ai.rateLimit]        # chat requests per user
# maxRequests = 30
# windowSeconds = 300
